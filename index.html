<!doctype html><html lang="af"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockSignal AI JSE</title><style>body{font:16px system-ui;background:#101b2a;color:#edf4ff;max-width:900px;margin:30px auto;padding:15px}h1{color:#77dfb3}button,select{padding:12px;border-radius:8px;font-size:16px}button{background:#48d5a0;border:0;cursor:pointer}.panel{background:#1b2c40;padding:20px;border-radius:12px;margin-top:16px}small{color:#bdc9d9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.value{font-size:26px;font-weight:bold}#error{color:#ff9a9a}</style><h1>StockSignal AI · JSE</h1><p>Hoë risiko · 3 maande · historiese EODHD-data (nie intyds nie)</p><label>Aandeel <select id="symbol">{% for s in symbols %}<option>{{s}}</option>{% endfor %}</select></label> <button onclick="load()">Ontleed aandeel</button><p id="error" role="alert"></p><div id="result"></div><script>async function load(){const s=document.getElementById('symbol').value;const out=document.getElementById('result');document.getElementById('error').textContent='';out.textContent='Laai historiese pryse...';try{const r=await fetch('/api/stock/'+encodeURIComponent(s));const d=await r.json();if(!r.ok)throw Error(d.error||'Onbekende fout');const fields=[['Sein',d.signal],['Telling',d.score+'/100'],['Laaste aangepaste sluitprys',d.price],['Datadatum',d.date],['RSI',d.rsi],['3-maande momentum',d.momentum_3m_pct+'%'],['50-dae gemiddelde',d.ma50],['200-dae gemiddelde',d.ma200],['Backtest strategie',d.strategy_return_pct+'%'],['Backtest koop-en-hou',d.buy_hold_return_pct+'%'],['Maksimum daling',d.max_drawdown_pct+'%'],['Transaksies',d.trades]];out.innerHTML='<div class="panel"><h2>'+s+'</h2><div class="grid">'+fields.map(([a,b])=>'<div><small>'+a+'</small><div class="value">'+b+'</div></div>').join('')+'</div><p><small>'+d.warning+'</small></p></div>'}catch(e){out.textContent='';document.getElementById('error').textContent=e.message}}load()</script></html>

<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockSignal AI v2 · JSE</title><style>body{background:#101c2c;color:#eef6ff;font:16px system-ui,Arial;margin:0;padding:30px;max-width:1150px}h1{color:#5cdeb3}button{background:#55d9b1;border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:bold}select{padding:12px;border-radius:8px}main{background:#1d3045;border-radius:14px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}.label{font-size:13px;color:#b5c9df}.value{font-size:25px;font-weight:750;margin-top:6px}.warning{color:#ffd38c;margin-top:20px}.error{color:#ffaaaa}small{color:#b5c9df}</style></head><body><h1>StockSignal AI · JSE v2</h1><p>Hoë risiko · 3 maande · Historiese EODHD-data (nie intyds nie)</p><label>Aandeel <select id="symbol">{% for s in symbols %}<option value="{{s}}">{{s}}</option>{% endfor %}</select></label> <button id="load">Ontleed aandeel</button><p id="status" aria-live="polite"></p><main id="result" hidden><h2 id="ticker"></h2><div class="grid" id="fields"></div><p class="warning" id="warning"></p></main><script>const $=id=>document.getElementById(id);const labels=[['signal','Sein'],['score','Telling /100'],['price','Aangepaste sluitingsprys'],['raw_close','Ruwe sluitingsprys'],['date','Datadatum'],['rsi','Wilder RSI'],['momentum_3m_pct','3-maande momentum (%)'],['ma50','50-dae gemiddelde'],['ma200','200-dae gemiddelde'],['strategy_return_pct','Backtest strategie (%)'],['buy_hold_return_pct','Backtest koop-en-hou (%)'],['max_drawdown_pct','Strategie maksimum daling (%)'],['buy_hold_max_drawdown_pct','Koop-en-hou maksimum daling (%)'],['trades','Transaksies'],['completed_positions','Afgeslote posisies'],['win_rate_pct','Wenkoers (%)'],['start_date','Backtest begin'],['end_date','Backtest einde'],['observations','Datapunte']];$('load').onclick=async()=>{let s=$('symbol').value;$('status').textContent='Laai data...';$('result').hidden=true;try{let r=await fetch('/api/stock/'+encodeURIComponent(s));let d=await r.json();if(!r.ok)throw Error(d.error||'Onbekende fout');$('ticker').textContent=d.symbol;$('fields').replaceChildren();for(const [key,label] of labels){let el=document.createElement('div');let a=document.createElement('div');a.className='label';a.textContent=label;let b=document.createElement('div');b.className='value';b.textContent=d[key]??'N/B';el.append(a,b);$('fields').append(el)}$('warning').textContent=[d.warning,d.currency_note,d.stale_data?'WAARSKUWING: data ouer as 5 kalenderdae.':'',d.no_trades?'WAARSKUWING: geen transaksies in backtest; 0% opbrengs is nie bewys van prestasie nie.':''].filter(Boolean).join(' ');$('result').hidden=false;$('status').textContent='Data ontvang.'}catch(e){$('status').textContent='Fout: '+e.message}};</script></body></html>
